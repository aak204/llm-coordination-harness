run:
  experiment_id: p0a-calibrated-full-live
  framework_id: coord_harness_v1
  stage: clean
  mode: research_strict
  description: Full calibrated P0a live run on calibrated CRAFT-mini and AgentsNet-mini tasks.
  output_root: outputs
  agent_count: 9
  total_billed_token_budget: 7000
  max_concurrency: 25
  capture_model_catalog_snapshot: true
  regime_thresholds:
    help_min_lift: 0.05
    collapse_max_lift: -0.05

benchmarks:
  - family: craft_mini
    stage: clean
    split: calibrated_full
    task_limit: 4
  - family: agentsnet_mini
    stage: clean
    split: calibrated_full
    task_limit: 4

model_panel:
  - alias: qwen35_plus_0215
    provider: openrouter
    model_id: qwen/qwen3.5-plus-02-15
    panel_tier: sweep
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [alibaba]
      allow_fallbacks: false
  - alias: gemini31_flash_lite_preview
    provider: openrouter
    model_id: google/gemini-3.1-flash-lite-preview
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [google-ai-studio]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star, balanced_tree]
  message_token_budgets: [0, 32, 96]
  model_aliases: [qwen35_plus_0215, gemini31_flash_lite_preview]
  model_tiers: []
  baselines: [sa_star, vote_local, ma_ft]
  seeds: [7, 11]
