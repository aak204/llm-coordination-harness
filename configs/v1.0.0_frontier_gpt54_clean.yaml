run:
  experiment_id: v1-0-0-frontier-gpt54-clean
  framework_id: coord_harness_v1
  stage: clean
  mode: research_strict
  description: Frontier clean hold-out for GPT-5.4 on Star and Linear Chain.
  output_root: outputs
  agent_count: 9
  total_billed_token_budget: 14000
  max_concurrency: 4
  capture_model_catalog_snapshot: true
  enable_reasoning: false

benchmarks:
  - family: craft_mini
    stage: clean
    split: v100_frontier_extra
    task_limit: 4
  - family: agentsnet_mini
    stage: clean
    split: v100_frontier_extra
    task_limit: 4

model_panel:
  - alias: gpt54
    provider: openrouter
    model_id: openai/gpt-5.4
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 128
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [openai]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star, linear_chain]
  message_token_budgets: [96]
  model_aliases: [gpt54]
  model_tiers: []
  baselines: [ma_ft]
  seeds: [7]
