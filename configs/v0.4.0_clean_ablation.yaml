run:
  experiment_id: v0-4-0-clean-ablation
  framework_id: coord_harness_v1
  stage: clean
  mode: research_strict
  description: Clean controls for v0.4 reasoning ablation on Star.
  output_root: outputs
  agent_count: 9
  total_billed_token_budget: 25000
  max_concurrency: 25
  capture_model_catalog_snapshot: true
  enable_reasoning: false

benchmarks:
  - family: craft_mini
    stage: clean
    split: v040_ablation_clean
    task_limit: 4
  - family: agentsnet_mini
    stage: clean
    split: v040_ablation_clean
    task_limit: 4

model_panel:
  - alias: gemini31_flash_lite_preview
    provider: openrouter
    model_id: google/gemini-3.1-flash-lite-preview
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 256
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [google-ai-studio]
      allow_fallbacks: false
  - alias: qwen35_plus_0215
    provider: openrouter
    model_id: qwen/qwen3.5-plus-02-15
    panel_tier: sweep
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 256
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [alibaba]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star]
  message_token_budgets: [96]
  model_aliases: [gemini31_flash_lite_preview, qwen35_plus_0215]
  model_tiers: []
  baselines: [ma_ft]
  seeds: [7, 11]
  enable_reasoning_values: [false, true]
