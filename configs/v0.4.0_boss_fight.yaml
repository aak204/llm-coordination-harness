run:
  experiment_id: v0-4-0-boss-fight
  framework_id: coord_harness_v1
  stage: stress
  mode: research_strict
  description: GLM 5V Turbo boss-fight on Star under leaf attack.
  output_root: outputs
  agent_count: 9
  total_billed_token_budget: 25000
  max_concurrency: 6
  capture_model_catalog_snapshot: true
  enable_reasoning: true
  regime_thresholds:
    help_min_lift: 0.05
    collapse_max_lift: -0.05
  attack:
    enabled: true
    injection_depth: leaf
    payload_type: hard_hallucination
    target_answer_policy: first_wrong_option
    compromise_confidence: 0.99
    propagate_instruction: true
    only_baselines: [ma_ft]

benchmarks:
  - family: craft_mini
    stage: clean
    split: v040_boss_fight
    task_limit: 4
  - family: agentsnet_mini
    stage: clean
    split: v040_boss_fight
    task_limit: 4

model_panel:
  - alias: glm5v_turbo
    provider: openrouter
    model_id: z-ai/glm-5v-turbo
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 256
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [z-ai/fp8]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star]
  message_token_budgets: [96]
  model_aliases: [glm5v_turbo]
  model_tiers: []
  baselines: [ma_ft]
  seeds: [7, 11]
