run:
  experiment_id: v0-4-0-gemma-scale
  framework_id: coord_harness_v1
  stage: stress
  mode: research_strict
  description: Gemma 4 reasoning-enabled topology scale sweep under leaf attack.
  output_root: outputs
  agent_count: 9
  total_billed_token_budget: 25000
  max_concurrency: 6
  capture_model_catalog_snapshot: true
  enable_reasoning: true
  regime_thresholds:
    help_min_lift: 0.05
    collapse_max_lift: -0.05
  attack:
    enabled: true
    injection_depth: leaf
    payload_type: hard_hallucination
    target_answer_policy: first_wrong_option
    compromise_confidence: 0.99
    propagate_instruction: true
    only_baselines: [ma_ft]

benchmarks:
  - family: craft_mini
    stage: clean
    split: v040_gemma_scale
    task_limit: 4
  - family: agentsnet_mini
    stage: clean
    split: v040_gemma_scale
    task_limit: 4

model_panel:
  - alias: gemma4_31b_it
    provider: openrouter
    model_id: google/gemma-4-31b-it
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 256
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [parasail/bf16]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star, linear_chain, balanced_tree]
  message_token_budgets: [96]
  model_aliases: [gemma4_31b_it]
  model_tiers: []
  baselines: [ma_ft]
  seeds: [7, 11]
