run:
  experiment_id: p0a-clean-smoke
  framework_id: coord_harness_v1
  stage: clean
  mode: research_strict
  description: Minimal runnable clean smoke config on repo-local benchmark packs.
  output_root: outputs
  agent_count: 5
  total_billed_token_budget: 2600
  capture_model_catalog_snapshot: false

benchmarks:
  - family: craft_mini
    stage: clean
    split: smoke
    task_limit: 2
  - family: agentsnet_mini
    stage: clean
    split: smoke
    task_limit: 2

model_panel:
  - alias: mock-local
    provider: mock
    model_id: mock/p0a-local-v1
    panel_tier: dev
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 96
    allow_auto_routing: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star]
  message_token_budgets: [32]
  model_aliases: [mock-local]
  model_tiers: []
  baselines: [sa_star, vote_local, ma_ft]
  seeds: [7]
