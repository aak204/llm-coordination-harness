run:
  experiment_id: p0a-clean-live-referee
  framework_id: coord_harness_v1
  stage: clean
  mode: research_strict
  description: Research-strict referee tier subset.
  output_root: outputs
  agent_count: 5
  total_billed_token_budget: 2200
  capture_model_catalog_snapshot: true

benchmarks:
  - family: craft_mini
    stage: clean
    split: pilot
    task_limit: 8
  - family: agentsnet_mini
    stage: clean
    split: pilot
    task_limit: 8

model_panel:
  - alias: qwen35_plus_0215
    provider: openrouter
    model_id: qwen/qwen3.5-plus-02-15
    panel_tier: sweep
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [alibaba]
      allow_fallbacks: false
  - alias: minimax_m27
    provider: openrouter
    model_id: minimax/minimax-m2.7
    panel_tier: referee
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [minimax]
      allow_fallbacks: false
  - alias: gemini31_flash_lite_preview
    provider: openrouter
    model_id: google/gemini-3.1-flash-lite-preview
    panel_tier: confirmatory
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [google-ai-studio]
      allow_fallbacks: false
  - alias: glm5
    provider: openrouter
    model_id: z-ai/glm-5
    panel_tier: referee
    temperature: 0.0
    top_p: 1.0
    max_completion_tokens: 48
    allow_auto_routing: false
    reasoning:
      effort: none
      exclude: true
    routing:
      only: [z-ai]
      allow_fallbacks: false

sweep:
  benchmark_families: [craft_mini, agentsnet_mini]
  topology_presets: [star, balanced_tree, sparse_graph]
  message_token_budgets: [0, 32, 96]
  model_aliases: []
  model_tiers: [referee]
  baselines: [sa_star, vote_local, ma_ft]
  seeds: [7]
